services:
  ksef-xml-to-pdf:
    container_name: ksef-xml-to-pdf
    build: .
    image: eletor/ksef-xml-to-pdf:1.0.0
    restart: unless-stopped
    init: true
    environment:
      API_KEY: ${API_KEY:?Set API_KEY with at least 32 characters}
      KSEF_ENVIRONMENT: ${KSEF_ENVIRONMENT:-production}
      PORT: "3000"
    expose:
      - "3000"
    shm_size: 256mb
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

networks:
  app_net:
    external: true
