name: Build and publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/eletor-com/ksef-xml-to-pdf
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ksef-converter:test
          cache-from: type=gha
      - name: Smoke test container
        env:
          API_KEY: ci-test-only-key-not-for-production-123456789
        run: |
          docker run --detach --rm --init --name converter-smoke --shm-size=256m --memory=1g --cap-drop=ALL --security-opt=no-new-privileges:true --env API_KEY="$API_KEY" -p 127.0.0.1:3080:3000 ksef-converter:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3080/healthz; then break; fi
            sleep 1
          done
          node scripts/smoke-test.mjs
      - name: Stop test container
        if: always()
        run: docker rm -f converter-smoke || true
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
